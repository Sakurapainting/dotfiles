config_version = 16

[bar]
order = [ "default" ]

    [bar.default]
    end = [
        "media",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "nightlight",
        "battery",
        "dsh",
        "control-center",
        "session"
    ]

[control_center.media]
show_visualizer = false

[hooks]
started = []
wallpaper_changed = [ "bash ~/.config/noctalia/apply-morandi.sh" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 823.0
    cy = 847.0
    output = "eDP-1"
    placement_height = 1029.0
    placement_width = 1646.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/you/图片/pixiewall-u1a6st-3840x2160.jpg"

[wallpaper.last]
path = "/home/you/图片/pixiewall-u1a6st-3840x2160.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.monitors.eDP-1]
path = "/home/you/图片/pixiewall-u1a6st-3840x2160.jpg"

[widget.dsh]
glyph = "message-chatbot"
label = "DSH"
tooltip = "DSH Web 启停"
type = "custom_button"

    [widget.dsh.actions]
    left = "exec /home/you/.local/bin/dsh-web-toggle"